<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff200">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>翌日配置表 v0.1.0</title>
<style>
  :root{
    --ink:#222;--muted:#6b7280;--line:#9ca3af;--soft:#f5f6f8;--yellow:#fff200;--red:#d90000;
    --blue:#2563eb;--green:#15803d;--orange:#d97706;--shadow:0 10px 30px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f3f4f6;color:var(--ink);font-family:"Meiryo","Yu Gothic UI",system-ui,sans-serif}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:1500px;margin:0 auto;padding:12px}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:10px;margin-bottom:8px}
  .toolbar .datebox{display:flex;align-items:center;gap:6px;font-weight:700}
  .toolbar input[type=date]{min-height:44px;border:1px solid #b8bec8;border-radius:8px;padding:6px 9px;font-size:16px;background:#fff}
  .btn{min-height:44px;border:1px solid #b8bec8;background:#fff;border-radius:9px;padding:8px 12px;font-weight:700}
  .btn.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}
  .btn.warn{color:#9a3412}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
  .hint strong{color:#1d4ed8}
  .selection{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:#fff7d6;border:2px solid #eab308;border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .selection.show{display:flex}
  .selection .who{font-weight:800}
  .grid-wrap{background:#fff;border:1px solid #9ca3af;border-radius:8px;overflow:auto;max-width:100%}
  table.grid{border-collapse:collapse;table-layout:fixed;min-width:900px;width:100%;background:#fff}
  .grid th.rowno,.grid td{border:1px solid #7c828b;height:38px;padding:0;vertical-align:middle}
  .grid th.rowno{width:38px;min-width:38px;background:#f7f7f7;text-align:center;font-weight:500;color:#4b5563;position:sticky;left:0;z-index:5}
  .grid td.cell{min-width:108px;width:108px;position:relative;background:#fff;overflow:visible}
  .grid td.cell:hover{background:#fafafa}
  .grid td.cell.empty::after{content:"";position:absolute;inset:4px;border:1px dashed transparent;border-radius:6px;pointer-events:none}
  @media (hover:hover){.grid td.cell.empty:hover::after{border-color:#d1d5db}.grid td.cell.empty:hover::before{content:"＋";position:absolute;right:5px;bottom:1px;color:#c5c8ce;font-size:14px}}
  .site-head{width:100%;height:100%;min-height:37px;border:0;background:var(--yellow);color:var(--red);font-weight:900;line-height:1.15;padding:3px 25px 3px 4px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;white-space:pre-line;overflow-wrap:anywhere}
  .site-head.selected-site{outline:3px solid #2563eb;outline-offset:-3px}
  .site-head.has-memo::before{content:"●";position:absolute;left:3px;top:2px;color:#2563eb;font-size:10px}
  .done-toggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:23px;height:23px;border:1px solid #b45309;border-radius:5px;background:#fff;color:#9a3412;font-weight:900;padding:0;line-height:20px;z-index:2}
  .done-toggle.on{background:#15803d;border-color:#15803d;color:#fff}
  .entry{width:100%;height:100%;min-height:36px;border:0;background:#fff;padding:2px 4px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry.vehicle{color:#087f5b}
  .entry.text{font-weight:600;color:#4b5563;font-size:12px}
  .entry.selected{background:#fff3bf;outline:3px solid #f59e0b;outline-offset:-3px}
  .standalone{width:100%;height:100%;min-height:36px;border:0;background:#fff;padding:2px 4px;font-size:12px;color:#374151;text-align:center;overflow-wrap:anywhere}
  .drop-target{outline:3px solid #2563eb!important;outline-offset:-3px}
  .holiday-row{display:grid;grid-template-columns:90px 1fr;gap:0;margin-top:8px;background:#fff;border:1px solid #7c828b;border-radius:7px;overflow:hidden}
  .holiday-label{background:var(--yellow);color:var(--red);font-weight:900;display:flex;align-items:center;justify-content:center;min-height:48px;border-right:1px solid #7c828b}
  .holiday-box{min-height:48px;padding:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .holiday-chip,.unassigned-chip{border:1px solid #9ca3af;background:#fff;border-radius:8px;padding:6px 9px;font-weight:800;min-height:36px}
  .holiday-chip.selected,.unassigned-chip.selected{background:#fff3bf;outline:2px solid #f59e0b}
  .memo-area{margin-top:8px;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:9px}
  .memo-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:5px}
  .memo-row{display:flex;gap:6px;align-items:stretch}
  .memo-row textarea{flex:1;min-height:64px;border:1px solid #b8bec8;border-radius:8px;padding:8px;font-size:16px;resize:vertical}
  .mic{min-width:52px;border:1px solid #b8bec8;background:#fff;border-radius:8px;font-size:22px}
  .mic.listening{background:#fee2e2;border-color:#ef4444}
  .mini-status{color:var(--muted);font-size:12px;margin-top:4px}
  dialog{border:0;border-radius:14px;box-shadow:var(--shadow);padding:0;max-width:460px;width:calc(100% - 28px);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .dlg{padding:16px}
  .dlg h2{font-size:19px;margin:0 0 12px}
  .dlg p{margin:6px 0 12px;color:#4b5563;font-size:14px}
  .dlg input,.dlg textarea,.dlg select{width:100%;border:1px solid #b8bec8;border-radius:9px;padding:9px;font-size:16px;background:#fff}
  .dlg textarea{min-height:110px;resize:vertical}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
  .big-choice{width:100%;min-height:56px;border:1px solid #b8bec8;background:#fff;border-radius:10px;font-size:17px;font-weight:800;margin:5px 0}
  .big-choice.primary{background:#eef5ff;border-color:#93b4ec;color:#1d4ed8}
  .big-choice.danger{color:#b91c1c}
  .site-menu-name{font-weight:900;background:var(--yellow);color:var(--red);padding:8px;border-radius:8px;text-align:center;margin-bottom:8px}
  details.settings-section{border-top:1px solid #e5e7eb;padding-top:10px;margin-top:10px}
  details.settings-section summary{font-weight:800;cursor:pointer;padding:5px 0}
  .settings-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .settings-note{font-size:12px;color:#6b7280;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .print-only{display:none}
  @media(max-width:700px){
    .app{padding:6px}.toolbar{padding:7px;gap:5px}.btn{padding:7px 9px}.grid td.cell{min-width:106px;width:106px}.hint{font-size:13px}.memo-row textarea{font-size:16px}
  }
  @page{size:A4 landscape;margin:7mm}
  @media print{
    *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}

    html,body{background:#fff}.app{max-width:none;padding:0}.toolbar,.hint,.selection,.memo-area .mic,.mini-status,.toast{display:none!important}
    .grid-wrap{border:0;border-radius:0;overflow:visible}.print-only{display:block}
    .print-title{font-weight:800;font-size:14pt;margin-bottom:4mm}.print-date{font-weight:700;margin-right:10px}
    table.grid{min-width:0;width:100%;font-size:8.5pt}.grid th.rowno{position:static;width:26px;min-width:26px}.grid th.rowno,.grid td{height:27px;border:1px solid #555}
    .grid td.cell{min-width:0;width:auto}.site-head{min-height:26px;font-size:8.5pt;padding:1px 2px;background:#fff200!important;color:#d90000!important;box-shadow:inset 0 0 0 1000px #fff200!important}.site-head.has-memo::before,.done-toggle{display:none!important}
    .entry,.standalone{min-height:26px;font-size:8.3pt;padding:1px 2px}.entry.text{font-size:7.7pt}
    .holiday-row{margin-top:2mm;border-radius:0;grid-template-columns:55px 1fr}.holiday-label,.holiday-box{min-height:28px}.holiday-label{background:#fff200!important;color:#d90000!important;box-shadow:inset 0 0 0 1000px #fff200!important}.holiday-chip{min-height:24px;padding:2px 5px;font-size:8pt}
    .memo-area{border:0;padding:0;margin-top:2mm}.memo-area.print-empty{display:none!important}.memo-area textarea{border:0;padding:0;min-height:0;height:auto;resize:none;font-size:8.5pt}.memo-area textarea::placeholder{color:transparent}.memo-title{font-size:8.5pt;margin:0}.memo-title span:last-child{display:none}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar">
    <label class="datebox">日付 <input id="dateInput" type="date"></label>
    <button class="btn" id="copyPrevBtn">前日のコピー</button>
    <button class="btn" id="undoBtn" disabled>↶ 元に戻す</button>
    <button class="btn primary" id="printBtn">PDF・印刷</button>
    <button class="btn" id="settingsBtn" aria-label="設定">⚙ 設定</button>
    <span style="margin-left:auto;font-size:12px;color:#6b7280;font-weight:700">v0.1.0</span>
  </div>

  <div class="hint"><strong>基本操作：</strong> 人を押す → 行き先の現場を押す ／ 空白を押す → 「文字」か「現場」 ／ 現場名を押す → 編集</div>

  <div class="selection" id="selectionBar">
    <span class="who" id="selectionName"></span>
    <span>を選択中。移動先の現場名か「休み」を押してください。</span>
    <button class="btn" id="editSelectedBtn">編集</button>
    <button class="btn" id="cancelSelectBtn">取消</button>
  </div>

  <div class="print-only print-title"><span class="print-date" id="printDate"></span>翌日配置表</div>
  <div class="grid-wrap">
    <table class="grid" id="grid"><tbody id="gridBody"></tbody></table>
  </div>

  <div class="holiday-row" id="holidayRow">
    <button class="holiday-label" id="holidayTarget" type="button">休み</button>
    <div class="holiday-box" id="holidayBox"></div>
  </div>

  <div class="memo-area">
    <div class="memo-title"><span>当日メモ</span><span style="font-size:12px;color:#6b7280">日付ごとに自動保存</span></div>
    <div class="memo-row">
      <textarea id="dailyMemo" placeholder="例：明日はU-17を持ち帰る／前川線の配置確認済み など"></textarea>
      <button class="mic" id="dailyMic" type="button" title="音声入力">🎤</button>
    </div>
    <div class="mini-status" id="dailyMicStatus"></div>
  </div>
</div>

<dialog id="emptyDlg">
  <div class="dlg">
    <h2>このマスで何をしますか？</h2>
    <button class="big-choice" id="addTextChoice">文字を書く</button>
    <button class="big-choice primary" id="addSiteChoice">ここに現場を作る</button>
    <div class="dlg-actions"><button class="btn" data-close="emptyDlg">取消</button></div>
  </div>
</dialog>

<dialog id="textDlg">
  <form class="dlg" id="textForm">
    <h2 id="textDlgTitle">文字を書く</h2>
    <input id="textInput" maxlength="40" autocomplete="off" required>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close="textDlg">取消</button>
      <button type="submit" class="btn primary">決定</button>
    </div>
  </form>
</dialog>

<dialog id="siteMenuDlg">
  <div class="dlg">
    <div class="site-menu-name" id="siteMenuName"></div>
    <button class="big-choice" id="renameSiteBtn">現場名を変更</button>
    <button class="big-choice" id="siteMemoBtn">現場メモ</button>
    <button class="big-choice" id="moveSiteBtn">場所を移動</button>
    <button class="big-choice" id="toggleDoneBtn">確認済みにする</button>
    <button class="big-choice danger" id="endSiteBtn">現場終了</button>
    <div class="dlg-actions"><button class="btn" data-close="siteMenuDlg">閉じる</button></div>
  </div>
</dialog>

<dialog id="memoDlg">
  <div class="dlg">
    <h2 id="memoTitle">現場メモ</h2>
    <div class="memo-row">
      <textarea id="siteMemoText" placeholder="現場ごとの当日メモ"></textarea>
      <button class="mic" id="siteMemoMic" type="button">🎤</button>
    </div>
    <div class="mini-status" id="siteMicStatus"></div>
    <div class="dlg-actions">
      <button class="btn" data-close="memoDlg">取消</button>
      <button class="btn primary" id="saveSiteMemoBtn">保存</button>
    </div>
  </div>
</dialog>

<dialog id="settingsDlg">
  <div class="dlg">
    <h2>設定</h2>
    <p>普段は触らなくて大丈夫です。配置表は編集するたび自動保存されます。</p>
    <details class="settings-section" open>
      <summary>人員・重機・車両を追加</summary>
      <div style="display:grid;grid-template-columns:1fr 110px;gap:6px;margin-top:8px">
        <input id="newItemName" placeholder="名前・車両名">
        <select id="newItemType"><option value="person">人員</option><option value="vehicle">重機・車両</option></select>
      </div>
      <button class="btn" id="addMasterItemBtn" style="margin-top:7px">追加して未配置へ</button>
      <div class="settings-note">追加したものは下の「未配置」に入ります。</div>
    </details>
    <details class="settings-section" open>
      <summary>未配置</summary>
      <div class="settings-list" id="unassignedList"></div>
      <div class="settings-note">項目を押すと選択状態になり、設定を閉じて現場名を押せば配置できます。</div>
    </details>
    <details class="settings-section">
      <summary>表の行数</summary>
      <div style="display:flex;gap:7px;align-items:center;margin-top:8px"><span id="rowCountLabel"></span><button class="btn" id="addRowsBtn">5行追加</button></div>
    </details>
    <details class="settings-section">
      <summary>バックアップ</summary>
      <button class="btn" id="exportBtn">バックアップを書き出す</button>
      <button class="btn" id="importBtn">バックアップを読み込む</button>
      <input id="importInput" type="file" accept="application/json" hidden>
      <div class="settings-note">通常は不要です。PC変更・故障に備える時だけ使います。</div>
    </details>
    <div class="dlg-actions"><button class="btn primary" data-close="settingsDlg">閉じる</button></div>
  </div>
</dialog>

<dialog id="confirmDlg">
  <div class="dlg">
    <h2 id="confirmTitle">確認</h2>
    <p id="confirmMessage"></p>
    <div class="dlg-actions">
      <button class="btn" id="confirmNo">取消</button>
      <button class="btn primary" id="confirmYes">実行</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const STORAGE_PREFIX='moriken_nextday_v010_';
const BACKUP_VERSION='0.1.0';
const DEFAULT_COLS=7;
const DEFAULT_ROWS=18; // numbered rows; row 0 is the top band like the source sheet
let currentDate='';
let state=null;
let undoStack=[];
let selected=null; // {source:'site'|'holiday'|'unassigned', siteId?, entryId?, item?}
let emptyTarget=null;
let siteMenuId=null;
let memoSiteId=null;
let movingSiteId=null;
let dragPayload=null;
let confirmResolver=null;
let saveTimer=null;

const $=id=>document.getElementById(id);
const els={
 date:$('dateInput'),body:$('gridBody'),holidayBox:$('holidayBox'),holidayTarget:$('holidayTarget'),dailyMemo:$('dailyMemo'),
 selectionBar:$('selectionBar'),selectionName:$('selectionName'),undoBtn:$('undoBtn'),toast:$('toast'),printDate:$('printDate'),
 emptyDlg:$('emptyDlg'),textDlg:$('textDlg'),textInput:$('textInput'),textDlgTitle:$('textDlgTitle'),siteMenuDlg:$('siteMenuDlg'),siteMenuName:$('siteMenuName'),
 memoDlg:$('memoDlg'),memoTitle:$('memoTitle'),siteMemoText:$('siteMemoText'),settingsDlg:$('settingsDlg'),unassignedList:$('unassignedList'),
 rowCountLabel:$('rowCountLabel'),confirmDlg:$('confirmDlg'),confirmTitle:$('confirmTitle'),confirmMessage:$('confirmMessage')
};

function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function deep(v){return JSON.parse(JSON.stringify(v))}
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
function safeSet(key,val){try{localStorage.setItem(key,val);return true}catch(e){toast('保存できませんでした。このブラウザでは端末保存が制限されています。');return false}}
function dayKey(date){return STORAGE_PREFIX+'day_'+date}
function metaKey(){return STORAGE_PREFIX+'meta'}
function pad(n){return String(n).padStart(2,'0')}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function formatJP(date){if(!date)return'';const [y,m,d]=date.split('-');return Number(m)+'月'+Number(d)+'日'}
function prevISO(date,days=1){const [y,m,d]=date.split('-').map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()-days);return isoLocal(x)}
function toast(msg){els.toast.textContent=msg;els.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.classList.remove('show'),2300)}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,120)}
function saveNow(){if(!state||!currentDate)return;safeSet(dayKey(currentDate),JSON.stringify(state));const meta=readMeta();meta.lastDate=currentDate;meta.dates=Array.from(new Set([...(meta.dates||[]),currentDate])).sort();safeSet(metaKey(),JSON.stringify(meta))}
function readMeta(){const raw=safeGet(metaKey());if(!raw)return{dates:[]};try{return JSON.parse(raw)}catch(e){return{dates:[]}}}
function pushUndo(){if(!state)return;undoStack.push(deep(state));if(undoStack.length>25)undoStack.shift();els.undoBtn.disabled=false}
function mutate(fn,msg){pushUndo();fn();scheduleSave();render();if(msg)toast(msg)}
function undo(){if(!undoStack.length)return;state=undoStack.pop();scheduleSave();render();toast('1つ前に戻しました');els.undoBtn.disabled=undoStack.length===0}

function demoState(){
 const sites=[
  {id:uid('s'),name:'象潟川K10\n（現場事務所）',row:0,col:0,done:false,memo:'',entries:[item('佐藤 匠真','person'),item('吉田 賢士','person'),item('細矢 浩之','person'),item('佐藤 恵','person'),item('佐藤 功','person'),item('佐藤 康平','person'),item('大須賀 仁','person')]},
  {id:uid('s'),name:'子吉川二十六木\n（河道掘削）',row:0,col:1,done:false,memo:'',entries:[item('佐々木 要','person'),item('佐々木家太郎','person')]},
  {id:uid('s'),name:'小砂川函渠',row:0,col:2,done:false,memo:'',entries:[item('阿部 準','person'),item('須田 海龍','person'),item('森 大翔','person'),item('木村 優斗','person'),item('視風 義悦','person'),item('佐藤 一志','person')]},
  {id:uid('s'),name:'象潟前川4工区',row:0,col:3,done:false,memo:'',entries:[item('佐藤 慎真','person'),item('佐々木弘充','person'),item('高橋 貴也','person'),item('三浦 寛','person'),item('高橋 優樹','person'),item('U-17①','vehicle')]},
  {id:uid('s'),name:'県道維持工事',row:0,col:4,done:false,memo:'',entries:[item('伊藤 晃','person'),item('須田 君蔵','person'),item('須田 春義','person'),item('須藤 大吉','person'),item('須田 聡','person'),item('軽ダンプ4520','vehicle')]},
  {id:uid('s'),name:'舗装・事務所',row:0,col:5,done:false,memo:'',entries:[item('斎藤 健之','person'),item('佐藤 慎','person')]},
  {id:uid('s'),name:'その他',row:0,col:6,done:false,memo:'',entries:[item('土門 保','person'),item('佐藤 一成','person'),item('須藤 均','person')]},
  {id:uid('s'),name:'舗装',row:16,col:0,done:false,memo:'',entries:[]},
  {id:uid('s'),name:'防雪',row:16,col:1,done:false,memo:'',entries:[]},
  {id:uid('s'),name:'象潟ファーム',row:16,col:2,done:false,memo:'',entries:[]},
  {id:uid('s'),name:'雑務',row:17,col:0,done:false,memo:'',entries:[]},
  {id:uid('s'),name:'にかほガス',row:17,col:1,done:false,memo:'',entries:[]},
  {id:uid('s'),name:'給水',row:17,col:2,done:false,memo:'',entries:[]}
 ];
 return{version:BACKUP_VERSION,rowCount:DEFAULT_ROWS,cols:DEFAULT_COLS,sites,standalone:[{id:uid('t'),text:'2tダンプ7239',row:16,col:5},{id:uid('t'),text:'いすず4tダンプ',row:16,col:6},{id:uid('t'),text:'2tダンプ7300',row:17,col:5},{id:uid('t'),text:'日野4tダンプ',row:17,col:6}],holiday:[],unassigned:[item('応援員','person')],dailyMemo:''}
}
function blankState(){return{version:BACKUP_VERSION,rowCount:DEFAULT_ROWS,cols:DEFAULT_COLS,sites:[],standalone:[],holiday:[],unassigned:[],dailyMemo:''}}
function item(label,type='person'){return{id:uid(type==='vehicle'?'v':'p'),label,type}}

function loadDay(date){
 saveNow();currentDate=date;undoStack=[];selected=null;movingSiteId=null;els.undoBtn.disabled=true;
 const raw=safeGet(dayKey(date));
 if(raw){try{state=JSON.parse(raw)}catch(e){state=blankState()}}
 else{
   const meta=readMeta();state=(meta.dates||[]).length===0?demoState():blankState();
   safeSet(dayKey(date),JSON.stringify(state));const m=readMeta();m.dates=Array.from(new Set([...(m.dates||[]),date])).sort();m.lastDate=date;safeSet(metaKey(),JSON.stringify(m));
 }
 els.dailyMemo.value=state.dailyMemo||'';render();
}

function siteById(id){return state.sites.find(s=>s.id===id)}
function siteEndRow(site){return site.row+site.entries.length}
function occupiedMap(excludeSiteId=null){
 const map=new Map();
 for(const s of state.sites){
  if(s.id===excludeSiteId)continue;
  map.set(s.row+','+s.col,{kind:'site',siteId:s.id,index:-1});
  s.entries.forEach((e,i)=>map.set((s.row+i+1)+','+s.col,{kind:'entry',siteId:s.id,entryId:e.id,index:i}));
 }
 for(const t of state.standalone)map.set(t.row+','+t.col,{kind:'standalone',textId:t.id});
 return map;
}
function cellSite(row,col){
 for(const s of state.sites){if(col===s.col && row>=s.row && row<=siteEndRow(s))return s}
 return null;
}
function canPlaceSite(site,row,col){
 if(col<0||col>=state.cols||row<0)return false;
 const map=occupiedMap(site.id);const height=site.entries.length+1;
 for(let r=row;r<row+height;r++){if(map.has(r+','+col))return false}
 return true;
}
function ensureRows(neededIndex){
 const numberedMax=Math.max(DEFAULT_ROWS,neededIndex); if(numberedMax>state.rowCount)state.rowCount=numberedMax;
}
function render(){
 if(!state)return;
 els.printDate.textContent=formatJP(currentDate);
 const map=occupiedMap();els.body.innerHTML='';
 const maxRow=Math.max(state.rowCount, ...state.sites.map(s=>siteEndRow(s)), ...state.standalone.map(t=>t.row),0);
 if(maxRow>state.rowCount)state.rowCount=maxRow;
 for(let r=0;r<=state.rowCount;r++){
   const tr=document.createElement('tr');
   const th=document.createElement('th');th.className='rowno';th.textContent=r===0?'':r;tr.appendChild(th);
   for(let c=0;c<state.cols;c++){
     const td=document.createElement('td');td.className='cell';td.dataset.row=r;td.dataset.col=c;
     const occ=map.get(r+','+c);
     if(!occ){td.classList.add('empty');td.addEventListener('click',()=>emptyCellClick(r,c));}
     else if(occ.kind==='site')renderSiteCell(td,siteById(occ.siteId));
     else if(occ.kind==='entry')renderEntryCell(td,siteById(occ.siteId),occ.entryId);
     else renderStandalone(td,state.standalone.find(t=>t.id===occ.textId));
     td.addEventListener('dragover',e=>{if(dragPayload){e.preventDefault();td.classList.add('drop-target')}});
     td.addEventListener('dragleave',()=>td.classList.remove('drop-target'));
     td.addEventListener('drop',e=>{e.preventDefault();td.classList.remove('drop-target');handleDrop(r,c)});
     tr.appendChild(td);
   }
   els.body.appendChild(tr);
 }
 renderHoliday();renderSelection();renderSettings();
}
function renderSiteCell(td,s){
 const b=document.createElement('button');b.type='button';b.className='site-head'+(s.memo?' has-memo':'')+(movingSiteId===s.id?' selected-site':'');b.textContent=s.name;b.draggable=true;
 b.title='タップで編集。PCではドラッグ移動もできます。';
 b.addEventListener('click',e=>{e.stopPropagation();siteClick(s.id)});
 b.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();openRenameSite(s.id)});
 b.addEventListener('dragstart',e=>{dragPayload={kind:'site',siteId:s.id};e.dataTransfer.effectAllowed='move'});
 b.addEventListener('dragend',()=>dragPayload=null);td.appendChild(b);
 const done=document.createElement('button');done.type='button';done.className='done-toggle'+(s.done?' on':'');done.textContent=s.done?'✓':'□';done.title=s.done?'確認済みを外す':'確認済みにする';
 done.addEventListener('click',e=>{e.stopPropagation();mutate(()=>s.done=!s.done,s.done?'確認済みを外しました':'確認済みにしました')});td.appendChild(done);
}
function renderEntryCell(td,s,entryId){
 const e=s.entries.find(x=>x.id===entryId);const b=document.createElement('button');b.type='button';b.className='entry '+(e.type||'text');
 if(selected&&selected.source==='site'&&selected.siteId===s.id&&selected.entryId===e.id)b.classList.add('selected');b.textContent=e.label;b.draggable=true;
 b.addEventListener('click',ev=>{ev.stopPropagation();selectEntry({source:'site',siteId:s.id,entryId:e.id})});
 b.addEventListener('dragstart',ev=>{dragPayload={kind:'entry',source:'site',siteId:s.id,entryId:e.id};ev.dataTransfer.effectAllowed='move'});b.addEventListener('dragend',()=>dragPayload=null);td.appendChild(b);
}
function renderStandalone(td,t){const b=document.createElement('button');b.type='button';b.className='standalone';b.textContent=t.text;b.addEventListener('click',e=>{e.stopPropagation();openEditStandalone(t.id)});td.appendChild(b)}
function renderHoliday(){
 els.holidayBox.innerHTML='';
 if(!state.holiday.length){const span=document.createElement('span');span.style.color='#9ca3af';span.style.fontSize='13px';span.textContent='休みの人をここへ';els.holidayBox.appendChild(span)}
 state.holiday.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='holiday-chip'+(selected&&selected.source==='holiday'&&selected.entryId===it.id?' selected':'');b.textContent=it.label;b.draggable=true;b.addEventListener('click',()=>selectEntry({source:'holiday',entryId:it.id}));b.addEventListener('dragstart',ev=>{dragPayload={kind:'entry',source:'holiday',entryId:it.id};ev.dataTransfer.effectAllowed='move'});b.addEventListener('dragend',()=>dragPayload=null);els.holidayBox.appendChild(b)});
}
function renderSelection(){
 if(!selected){els.selectionBar.classList.remove('show');return}
 const it=getSelectedItem();if(!it){selected=null;els.selectionBar.classList.remove('show');return}
 els.selectionName.textContent=it.label;els.selectionBar.classList.add('show');
}
function renderSettings(){
 if(!state)return;els.rowCountLabel.textContent='現在：'+state.rowCount+'行';els.unassignedList.innerHTML='';
 if(!state.unassigned.length){const s=document.createElement('span');s.className='settings-note';s.textContent='未配置なし';els.unassignedList.appendChild(s)}
 state.unassigned.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='unassigned-chip'+(selected&&selected.source==='unassigned'&&selected.entryId===it.id?' selected':'');b.textContent=it.label;b.addEventListener('click',()=>{selectEntry({source:'unassigned',entryId:it.id});els.settingsDlg.close()});els.unassignedList.appendChild(b)});
}
function getSelectedItem(){
 if(!selected)return null;
 if(selected.source==='site'){const s=siteById(selected.siteId);return s&&s.entries.find(e=>e.id===selected.entryId)}
 const arr=selected.source==='holiday'?state.holiday:state.unassigned;return arr.find(e=>e.id===selected.entryId)
}
function selectEntry(sel){if(selected&&JSON.stringify(selected)===JSON.stringify(sel)){selected=null}else{selected=sel;movingSiteId=null}render()}
function cancelSelection(){selected=null;movingSiteId=null;render()}

function siteClick(siteId){
 if(movingSiteId){if(movingSiteId===siteId){movingSiteId=null;render();return}toast('移動先は空白のマスを押してください');return}
 if(selected){moveSelectedToSite(siteId);return}
 siteMenuId=siteId;const s=siteById(siteId);els.siteMenuName.textContent=s.name;$('toggleDoneBtn').textContent=s.done?'確認済みを外す':'確認済みにする';els.siteMenuDlg.showModal();
}
function canAppendSelectedToSite(target){
 const newRow=target.row+target.entries.length+1;
 const map=occupiedMap();const occ=map.get(newRow+','+target.col);
 if(!occ)return true;
 if(selected&&selected.source==='site'&&occ.kind==='entry'&&occ.siteId===selected.siteId&&occ.entryId===selected.entryId)return true;
 return false;
}
function moveSelectedToSite(siteId){
 const target=siteById(siteId);const it=getSelectedItem();if(!target||!it)return;
 if(!canAppendSelectedToSite(target)){toast('この現場の下に空きがありません。現場を移動するか、下の内容を移してください');return}
 mutate(()=>{
   removeSelectedItem();target.entries.push(it);selected=null;
   ensureRows(target.row+target.entries.length);
 },it.label+' → '+target.name.replace(/\n/g,' '));
}
function moveSelectedToHoliday(){
 if(!selected)return;const it=getSelectedItem();if(!it)return;
 mutate(()=>{removeSelectedItem();state.holiday.push(it);selected=null},it.label+' → 休み');
}
function removeSelectedItem(){
 if(selected.source==='site'){const s=siteById(selected.siteId);const i=s.entries.findIndex(e=>e.id===selected.entryId);if(i>=0)s.entries.splice(i,1)}
 else{const arr=selected.source==='holiday'?state.holiday:state.unassigned;const i=arr.findIndex(e=>e.id===selected.entryId);if(i>=0)arr.splice(i,1)}
}
function emptyCellClick(row,col){
 if(movingSiteId){moveSiteTo(movingSiteId,row,col);return}
 if(selected){toast('移動先の現場名か「休み」を押してください');return}
 emptyTarget={row,col};els.emptyDlg.showModal();
}
function moveSiteTo(siteId,row,col){
 const s=siteById(siteId);if(!s)return;
 if(!canPlaceSite(s,row,col)){toast('そこには置けません。空いている場所を選んでください');return}
 mutate(()=>{s.row=row;s.col=col;movingSiteId=null;ensureRows(row+s.entries.length)},'現場を移動しました');
}
function handleDrop(row,col){
 if(!dragPayload)return;
 const occ=occupiedMap().get(row+','+col);const p=dragPayload;dragPayload=null;
 if(p.kind==='site'){if(occ){toast('空いているマスへ移動してください');return}moveSiteTo(p.siteId,row,col);return}
 if(p.kind==='entry'){
   const targetSite=occ?cellSite(row,col):null;if(!targetSite){toast('現場名または現場内へドロップしてください');return}
   selected={source:p.source,siteId:p.siteId,entryId:p.entryId};moveSelectedToSite(targetSite.id);
 }
}

function inferSiteForAppend(row,col){return state.sites.find(s=>s.col===col&&siteEndRow(s)===row-1)||null}
function addTextAtCell(text,row,col){
 const s=inferSiteForAppend(row,col);
 if(s){s.entries.push({id:uid('t'),label:text,type:'text'});ensureRows(s.row+s.entries.length)}else state.standalone.push({id:uid('t'),text,row,col});
}
function addSiteAtCell(name,row,col){
 const s={id:uid('s'),name,row,col,done:false,memo:'',entries:[]};if(!canPlaceSite(s,row,col))return false;state.sites.push(s);return true
}

function openRenameSite(id){siteMenuId=id;const s=siteById(id);els.textDlgTitle.textContent='現場名を変更';els.textInput.value=s.name.replace(/\n/g,' ');els.textInput.dataset.mode='renameSite';els.textDlg.showModal();setTimeout(()=>els.textInput.focus(),0)}
function openEditStandalone(id){const t=state.standalone.find(x=>x.id===id);els.textDlgTitle.textContent='文字を修正';els.textInput.value=t.text;els.textInput.dataset.mode='editStandalone';els.textInput.dataset.id=id;els.textDlg.showModal();setTimeout(()=>els.textInput.focus(),0)}
function openEditSelected(){const it=getSelectedItem();if(!it)return;els.textDlgTitle.textContent='名前・文字を修正';els.textInput.value=it.label;els.textInput.dataset.mode='editSelected';els.textDlg.showModal();setTimeout(()=>els.textInput.focus(),0)}

function confirmBox(title,message,yesText='実行'){return new Promise(resolve=>{confirmResolver=resolve;els.confirmTitle.textContent=title;els.confirmMessage.textContent=message;$('confirmYes').textContent=yesText;els.confirmDlg.showModal()})}
async function endSite(){const s=siteById(siteMenuId);if(!s)return;if(s.entries.length){toast('先にこの現場の人員・車両・文字を移動してください');return}const ok=await confirmBox('現場終了',s.name.replace(/\n/g,' ')+' を配置表から終了しますか？','終了する');if(!ok)return;mutate(()=>{state.sites=state.sites.filter(x=>x.id!==s.id)},'現場を終了しました');els.siteMenuDlg.close()}

async function copyPrevious(){
 const exact=prevISO(currentDate,1);let source=exact;let raw=safeGet(dayKey(source));
 if(!raw){const meta=readMeta();const older=(meta.dates||[]).filter(d=>d<currentDate).sort().reverse();source=older[0]||'';if(!source){toast('コピーできる過去の配置表がありません');return}const ok=await confirmBox('前日の配置表がありません',formatJP(exact)+'の配置表がありません。直近の'+formatJP(source)+'をコピーしますか？','コピーする');if(!ok)return;raw=safeGet(dayKey(source))}
 const src=JSON.parse(raw);const ok=source===exact?await confirmBox('前日のコピー',formatJP(source)+'の配置をコピーしますか？','コピーする'):true;if(!ok)return;
 pushUndo();state=deep(src);state.dailyMemo='';state.sites.forEach(s=>{s.memo='';s.done=false});safeSet(dayKey(currentDate),JSON.stringify(state));els.dailyMemo.value='';render();toast(formatJP(source)+'の配置をコピーしました')
}

function startSpeech(textarea,statusEl,button){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.textContent='このブラウザは音声入力に対応していません。Chrome / Edge等でお試しください。';return}
 const rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.continuous=false;button.classList.add('listening');statusEl.textContent='聞き取り中…';
 rec.onresult=e=>{const t=e.results[0][0].transcript;const before=textarea.value.trim();textarea.value=before?(before+' '+t):t;textarea.dispatchEvent(new Event('input',{bubbles:true}));statusEl.textContent='入力しました'};
 rec.onerror=e=>{statusEl.textContent='音声入力できませんでした（'+e.error+'）'};rec.onend=()=>button.classList.remove('listening');try{rec.start()}catch(e){button.classList.remove('listening')}
}

function exportBackup(){
 const meta=readMeta();const payload={app:'moriken_nextday',version:BACKUP_VERSION,exportedAt:new Date().toISOString(),meta,days:{}};(meta.dates||[]).forEach(d=>{const r=safeGet(dayKey(d));if(r)payload.days[d]=JSON.parse(r)});
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='翌日配置表_バックアップ_'+isoLocal(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
async function importBackup(file){
 try{const txt=await file.text();const p=JSON.parse(txt);if(p.app!=='moriken_nextday'||!p.days)throw new Error('形式');const ok=await confirmBox('バックアップ読込','現在の保存データにバックアップ内容を追加・上書きします。よろしいですか？','読み込む');if(!ok)return;Object.entries(p.days).forEach(([d,v])=>safeSet(dayKey(d),JSON.stringify(v)));safeSet(metaKey(),JSON.stringify(p.meta||{dates:Object.keys(p.days)}));loadDay(currentDate);toast('バックアップを読み込みました')}catch(e){toast('バックアップファイルを読み込めませんでした')}
}

// listeners
els.date.addEventListener('change',()=>loadDay(els.date.value));
$('copyPrevBtn').addEventListener('click',copyPrevious);els.undoBtn.addEventListener('click',undo);$('printBtn').addEventListener('click',()=>{saveNow();window.print()});$('settingsBtn').addEventListener('click',()=>{renderSettings();els.settingsDlg.showModal()});
$('cancelSelectBtn').addEventListener('click',cancelSelection);$('editSelectedBtn').addEventListener('click',openEditSelected);els.holidayTarget.addEventListener('click',()=>{if(selected)moveSelectedToHoliday();else toast('先に休みにする人を押してください')});
els.dailyMemo.addEventListener('input',()=>{state.dailyMemo=els.dailyMemo.value;scheduleSave()});$('dailyMic').addEventListener('click',()=>startSpeech(els.dailyMemo,$('dailyMicStatus'),$('dailyMic')));

$('addTextChoice').addEventListener('click',()=>{els.emptyDlg.close();els.textDlgTitle.textContent='文字を書く';els.textInput.value='';els.textInput.dataset.mode='addText';els.textDlg.showModal();setTimeout(()=>els.textInput.focus(),0)});
$('addSiteChoice').addEventListener('click',()=>{els.emptyDlg.close();els.textDlgTitle.textContent='現場名を入力';els.textInput.value='';els.textInput.dataset.mode='addSite';els.textDlg.showModal();setTimeout(()=>els.textInput.focus(),0)});
$('textForm').addEventListener('submit',e=>{e.preventDefault();const v=els.textInput.value.trim();if(!v)return;const mode=els.textInput.dataset.mode;
 if(mode==='addText'){mutate(()=>addTextAtCell(v,emptyTarget.row,emptyTarget.col),'文字を追加しました')}
 else if(mode==='addSite'){mutate(()=>{if(!addSiteAtCell(v,emptyTarget.row,emptyTarget.col))throw new Error('place')},'現場を追加しました')}
 else if(mode==='renameSite'){mutate(()=>siteById(siteMenuId).name=v,'現場名を変更しました');els.siteMenuDlg.close()}
 else if(mode==='editStandalone'){const id=els.textInput.dataset.id;mutate(()=>state.standalone.find(x=>x.id===id).text=v,'文字を修正しました')}
 else if(mode==='editSelected'){const it=getSelectedItem();mutate(()=>it.label=v,'修正しました');selected=null}
 els.textDlg.close();
});

$('renameSiteBtn').addEventListener('click',()=>{els.siteMenuDlg.close();openRenameSite(siteMenuId)});
$('siteMemoBtn').addEventListener('click',()=>{const s=siteById(siteMenuId);memoSiteId=s.id;els.memoTitle.textContent=s.name.replace(/\n/g,' ')+' のメモ';els.siteMemoText.value=s.memo||'';els.siteMenuDlg.close();els.memoDlg.showModal()});
$('moveSiteBtn').addEventListener('click',()=>{movingSiteId=siteMenuId;els.siteMenuDlg.close();render();toast('移動先の空白マスを押してください')});
$('toggleDoneBtn').addEventListener('click',()=>{const s=siteById(siteMenuId);mutate(()=>s.done=!s.done,s.done?'確認済みを外しました':'確認済みにしました');els.siteMenuDlg.close()});
$('endSiteBtn').addEventListener('click',endSite);
$('saveSiteMemoBtn').addEventListener('click',()=>{const s=siteById(memoSiteId);mutate(()=>s.memo=els.siteMemoText.value,'現場メモを保存しました');els.memoDlg.close()});$('siteMemoMic').addEventListener('click',()=>startSpeech(els.siteMemoText,$('siteMicStatus'),$('siteMemoMic')));

$('addMasterItemBtn').addEventListener('click',()=>{const name=$('newItemName').value.trim();const type=$('newItemType').value;if(!name)return;mutate(()=>state.unassigned.push(item(name,type)),'未配置へ追加しました');$('newItemName').value='';renderSettings()});
$('addRowsBtn').addEventListener('click',()=>mutate(()=>state.rowCount+=5,'5行追加しました'));
$('exportBtn').addEventListener('click',exportBackup);$('importBtn').addEventListener('click',()=>$('importInput').click());$('importInput').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''})

$('confirmNo').addEventListener('click',()=>{els.confirmDlg.close();if(confirmResolver){confirmResolver(false);confirmResolver=null}});$('confirmYes').addEventListener('click',()=>{els.confirmDlg.close();if(confirmResolver){confirmResolver(true);confirmResolver=null}});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
window.addEventListener('beforeprint',()=>{const area=document.querySelector('.memo-area');area.classList.toggle('print-empty',!els.dailyMemo.value.trim())});
window.addEventListener('afterprint',()=>document.querySelector('.memo-area').classList.remove('print-empty'));

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(selected||movingSiteId)){cancelSelection()}});

// initial
const today=isoLocal(new Date());const meta=readMeta();els.date.value=meta.lastDate||today;loadDay(els.date.value);
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
